apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: db
spec:
  ports:
  - port: 3306
  clusterIP: None
  selector:
    component: mysql
    project: roboshop
    tier: db
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: db
spec:
  ports:
  - port: 3306
  selector:
    component: mysql
    project: roboshop
    tier: db
---
apiVersion: v1
kind: Secret
metadata: 
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: database
type: opaque
data:
  MYSQL_ROOT_PASSWORD: "Um9ib1Nob3BAMQ=="
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: db
spec:
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      tier: db
  replicas: 2 # by default is 1
  template:
    metadata:
      labels:
        component: mysql
        project: roboshop
        tier: db
    spec:
      containers:
      - name: mysql
        image: vidya07422/mysql:v1
        volumeMounts:
        - name: mysql
          mountPath: /var/lib/mysql
      envFrom:
      - secretRef:
          name: mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs-sc"
      resources:
        requests:
          storage: 2Gi
